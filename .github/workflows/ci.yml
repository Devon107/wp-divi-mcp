name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: PHP lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all PHP files
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 php -l

  node:
    name: Desktop proxy tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ '18', '22' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run node tests
        run: node --test tests/node/*.test.mjs

  test:
    name: Tests (wp-env, PHP 8.2)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
      - name: Start wp-env (PHP 8.2, from .wp-env.json)
        # MySQL sometimes is not ready when wp-env first runs WP-CLI
        # ("Error establishing a database connection"), so retry a few times.
        run: |
          for attempt in 1 2 3; do
            npx wp-env start && exit 0
            echo "wp-env start failed (attempt $attempt), retrying in 15s"
            sleep 15
          done
          exit 1
      - name: Run tests (Divi group excluded)
        run: bin/test
      - name: Run Yoast SEO tests
        run: WPDM_TEST_YOAST=1 bin/test --group yoast
